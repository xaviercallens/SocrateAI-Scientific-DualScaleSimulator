name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache rust target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/rust_simulator/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust_simulator/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Run rust tests
        working-directory: rust_simulator
        run: cargo test --release

  python:
    needs: lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install numpy scipy scikit-learn matplotlib pandas
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            lean-${{ runner.os }}-
      - name: Build Lean project
        run: lake build
      - name: Run pytest
        run: pytest -q

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            lean-${{ runner.os }}-
      - name: Build Lean project
        run: lake build
      - name: Run lean axiom audit
        continue-on-error: true
        run: |
          if [ -f scripts/lean_axiom_audit.py ]; then
            python3 scripts/lean_axiom_audit.py
          else
            echo "lean_axiom_audit.py not found, skipping"
          fi
      - name: Upload lean axiom audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean_axiom_report
          path: audit/lean_axiom_report.json
          if-no-files-found: ignore

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install numpy scipy scikit-learn matplotlib pandas
      - name: Run cross consistency check
        continue-on-error: true
        run: |
          if [ -f scripts/cross_consistency_check.py ]; then
            python3 scripts/cross_consistency_check.py
          else
            echo "cross_consistency_check.py not found, skipping"
          fi
      - name: Upload consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross_consistency_report
          path: audit/cross_consistency.md
          if-no-files-found: ignore
